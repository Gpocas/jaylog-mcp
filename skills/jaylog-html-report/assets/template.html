    listeners.push(refresh);
  }

  function valuesSection(def) {
    var ds = dsFor(def.field, def.dataset);
    var all = ds ? rankedValues(ds, def.field) : [];
    var sec = sideSection('f-' + def.field, def.label || labelOf(def.field), { closed: all.length > 12 });
    var term = '';
    if (!ds) { sec.body.appendChild(el('p', 'side-note', 'Campo sem dados.')); return function () {}; }
    if (all.length > 8) {
      var search = el('input', 'search');
      search.type = 'search';
      search.placeholder = 'Buscar em ' + (def.label || labelOf(def.field)).toLowerCase();
      search.setAttribute('aria-label', search.placeholder);
      search.addEventListener('input', function () { term = search.value.trim().toLowerCase(); render(); });
      sec.body.appendChild(search);
    }
    var list = el('div', 'opt-list');
    sec.body.appendChild(list);
    var foot = el('div', 'side-actions');
    foot.appendChild(btn(null, 'Limpar ' + (def.label || labelOf(def.field)).toLowerCase(), function () { setValues(def.field, []); }));
    sec.body.appendChild(foot);
    function render() {
      var counts = {};
      filteredRows(ds, def.field).forEach(function (r) { var k = String(r[def.field]); counts[k] = (counts[k] || 0) + weight(ds, r); });
      var cur = state.sel[def.field] || [];
      list.textContent = '';
      var shown = all.filter(function (v) { return !term || v.toLowerCase().indexOf(term) >= 0; }).slice(0, 200);
      if (!shown.length) list.appendChild(el('p', 'side-note', 'Nada encontrado.'));
      shown.forEach(function (v) {
        list.appendChild(optionRow(cur.indexOf(v) >= 0, v, counts[v] || 0, function () { toggleValue(def.field, v); }));
      });
      foot.hidden = !cur.length;
      sec.badge.textContent = String(cur.length);
      sec.badge.hidden = !cur.length;
    }
    return render;
  }
  function rangeSection(def) {
    var ds = dsFor(def.field, def.dataset);
    var days = ds ? timeDomain(ds, def.field, true).filter(isDay) : [];
    var first = days[0], last = days[days.length - 1];
    var sec = sideSection('periodo', def.label || 'Período');
    var presets = [{ label: 'Todo o período', from: null }];
    [7, 14, 30].forEach(function (n) { if (days.length > n) presets.push({ label: 'Últimos ' + n + ' dias', from: days[days.length - n], to: last }); });
    var list = el('div');
    sec.body.appendChild(list);
    var custom = el('div', 'custom-range');
    var from = el('input'), to = el('input');
    [from, to].forEach(function (i) { i.type = 'date'; i.min = first; i.max = last; });
    from.setAttribute('aria-label', 'Data inicial'); to.setAttribute('aria-label', 'Data final');
    custom.appendChild(el('span', null, 'De')); custom.appendChild(from);
    custom.appendChild(el('span', null, 'Até')); custom.appendChild(to);
    custom.appendChild(btn(null, 'Aplicar', function () { if (from.value && to.value) setRange(from.value, to.value); }));
    sec.body.appendChild(custom);
    return function render() {
      list.textContent = '';
      presets.forEach(function (p) {
        var active = p.from === null ? !state.range : !!(state.range && state.range.from === p.from && state.range.to === p.to);
        list.appendChild(optionRow(active, p.label, null, function () { setRange(p.from, p.to); }, true));
      });
      if (document.activeElement !== from) from.value = state.range ? state.range.from : first;
      if (document.activeElement !== to) from.value = state.range ? state.range.to : last;
      sec.badge.textContent = state.range ? '1' : '';
      sec.badge.hidden = !state.range;
    };
  }

  // ======================================================================
  // painel de detalhes
  // ======================================================================
  var drawer = document.getElementById('drawer');
  var drawerBody = document.getElementById('drawer-body');
  var drawerState = null, drawerCharts = [], lastFocus = null;
  function openDrawer(s) {
    if (!drawer.classList.contains('open')) lastFocus = document.activeElement;
    drawerState = s;
    renderDrawer();
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    document.getElementById('drawer-close').focus({ preventScroll: true });
  }
  function closeDrawer() {
    if (!drawerState) return;
    drawerState = null;
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    drawerCharts.forEach(function (c) { c.dispose(); });
    drawerCharts = [];
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  function miniChart(host, cats, series, opts) {
    var box = el('div', 'mini-chart');
    host.appendChild(box);
    var inst = echarts.init(box, null, { renderer: 'canvas' });
    drawerCharts.push(inst);
    var view = { kind: opts.kind || 'bar', dates: true, unit: opts.unit, series: series };
    if (view.kind === 'line') view.x = cats; else view.categories = cats;
    var o = cartesianOption(view, null);
    o.grid = { left: 4, right: 12, top: series.length > 1 ? 36 : (spec.events && spec.events.length ? 22 : 8), bottom: 4, containLabel: true };
    o.dataZoom = undefined;
    inst.setOption(o);
    return inst;
  }
  function h4(text) { return el('h4', null, text); }
  function renderSpecDetails(body, d) {
    if (!d) return;
    (d.paragraphs || (d.text ? [d.text] : [])).forEach(function (p) { body.appendChild(el('p', null, p)); });
    if (d.facts && d.facts.length) {
      var dl = el('dl', 'facts');
      d.facts.forEach(function (f) { dl.appendChild(el('dt', null, f.label)); dl.appendChild(el('dd', null, fmt(f.value, f.unit))); });
      body.appendChild(dl);
    }
    if (d.samples && d.samples.length) {
      body.appendChild(h4('Exemplos'));
      var box = el('div', 'samples');
      d.samples.forEach(function (s) { box.appendChild(el('code', 'mono', s)); });
      body.appendChild(box);
    }
    if (d.links && d.links.length) {
      var p = el('p');
      d.links.forEach(function (l, i) {
        var url = safeUrl(l.url);
        if (!url) return;
        var a = el('a', null, l.label || url); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        if (i) p.appendChild(document.createTextNode(' · '));
        p.appendChild(a);
      });
      body.appendChild(p);
    }
  }
  function stat(label, value) {
    var s = el('div', 'stat');
    s.appendChild(el('div', 'label', label));
    s.appendChild(el('div', 'value', value));
    return s;
  }
  function barList(items, total, onClick, color) {
    var wrap = el('div', 'bars');
    var fills = [];
    items.forEach(function (it) {
      var row = btn('bar-row');
      var n = el('span', 'name', it.name); n.title = it.name;
      row.appendChild(n);
      row.appendChild(el('span', 'num', it.label || fmt(it.value)));
      var track = el('span', 'track'), fill = el('span', 'fill');
      if (color) fill.style.background = color;
      track.appendChild(fill); row.appendChild(track);
      fills.push([fill, total ? Math.max(2, (Math.abs(it.value) / total) * 100) : 0]);
      if (onClick) row.addEventListener('click', function () { onClick(it); }); else row.disabled = true;
      wrap.appendChild(row);
    });
    requestAnimationFrame(function () { requestAnimationFrame(function () { fills.forEach(function (f) { f[0].style.width = f[1] + '%'; }); }); });
    return wrap;
  }
  function renderValueDrawer(s) {
    var field = s.field, value = String(s.value);
    var ds = dsFor(field, s.dataset);
    document.getElementById('drawer-eyebrow').textContent = labelOf(field);
    document.getElementById('drawer-title').textContent = value;
    var body = drawerBody;
    var extra = spec.details && spec.details[field] && spec.details[field][value];
    if (s.node && s.node.detail) body.appendChild(el('p', null, s.node.detail));
    if (!ds) { renderSpecDetails(body, extra); return; }
    var m = measureOf(ds, {});
    var base = filteredRows(ds, field);
    var mine = base.filter(function (r) { return String(r[field]) === value; });
    var total = aggRows(mine, m), all = aggRows(base, m);
    var stats = el('div', 'stats');
    stats.appendChild(stat(hasFilters() ? 'No recorte' : 'Total', fmt(total, ds.unit)));
    stats.appendChild(stat('Participação', all ? pf.format(total / all) : '—'));
    var tf = ds.time || (rangeDef && rangeDef.field);
    if (tf && ds.fields[tf]) {
      var lastSeen = aggRows(mine, { agg: 'max', field: tf });
      stats.appendChild(stat('Última vez', lastSeen ? fmtDate(lastSeen) : '—'));
    }
    body.appendChild(stats);
    renderSpecDetails(body, extra);

    if (tf && ds.fields[tf] && field !== tf) {
      body.appendChild(h4('Ao longo do tempo'));
      var es = entitySeries(ds, field, tf, [value], base);
      miniChart(body, es.buckets, [{ name: value, values: es.series[value], slot: 0 }], { unit: ds.unit });
    }
    var dims = [];
    filterDefs.forEach(function (d) { if (d.kind !== 'date-range') dims.push(d.field); });
    ds.dimensions.forEach(function (d) { if (dims.indexOf(d) < 0) dims.push(d); });
    dims = dims.filter(function (d) { return d !== field && d !== tf && ds.fields[d]; });
    dims.forEach(function (d) {
      var tot = {};
      mine.forEach(function (r) { var k = r[d]; if (k === null || k === undefined || k === '') return; k = String(k); tot[k] = (tot[k] || 0) + weight(ds, r); });
      var keys = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; });
      if (!keys.length || (keys.length === 1 && dims.length > 2)) return;
      body.appendChild(h4('Por ' + labelOf(d).toLowerCase()));
      body.appendChild(barList(keys.slice(0, 6).map(function (k) { return { name: k, value: tot[k], label: fmt(tot[k]) + ' · ' + pf.format(total ? tot[k] / total : 0) }; }), total,
        function (it) { openDrawer({ kind: 'value', field: d, value: it.name, dataset: ds.name }); }));
    });
    if (tf && ds.fields[tf] && field !== tf) {
      var cands = rankedValues(ds, field).filter(function (v) { return v !== value; }).slice(0, 40);
      var es2 = entitySeries(ds, field, tf, cands.concat(value), base);
      var corr = cands.map(function (v) { return { name: v, value: pearson(es2.series[value], es2.series[v]) }; })
        .filter(function (c) { return c.value !== null && c.value >= MIN_R; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, 5);
      body.appendChild(h4('Varia junto com (' + labelOf(field).toLowerCase() + ')'));
      if (corr.length) {
        body.appendChild(barList(corr.map(function (c) { return { name: c.name, value: c.value, label: 'r ' + fmtR(c.value) }; }), 1,
          function (it) { openDrawer({ kind: 'pair', dataset: ds.name, field: field, bucket: tf, a: value, b: it.name }); }, css('--div-pos')));
        body.appendChild(el('p', 'note', 'Correlação de Pearson entre as séries por ' + (isDay(es2.buckets[0] || '') ? 'dia' : 'intervalo') + ' (' + es2.buckets.length + ' pontos). Indica que variam juntos, não que um causa o outro. Clique para comparar.'));
      } else body.appendChild(el('p', 'note', 'Nenhum outro valor varia junto (r ≥ ' + nf2.format(MIN_R) + ') no período.'));
    }
    var actions = el('div', 'actions');
    var on = selectorFor(field);
    var active = on && on(value);
    actions.appendChild(btn(active ? '' : 'primary', active ? 'Remover filtro' : 'Filtrar o relatório por isto', function () { clickValue(field, value); }));
    body.appendChild(actions);
  }
  function renderPairDrawer(s) {
    var ds = datasets[s.dataset];
    document.getElementById('drawer-eyebrow').textContent = 'Correlação · ' + labelOf(s.field);
    document.getElementById('drawer-title').textContent = s.a + ' × ' + s.b;
    var body = drawerBody;
    var rows = filteredRows(ds, s.field);
    var es = entitySeries(ds, s.field, s.bucket, [s.a, s.b], rows);
    var r = pearson(es.series[s.a], es.series[s.b]);
    var stats = el('div', 'stats');
    stats.appendChild(stat('r (Pearson)', r === null ? '—' : fmtR(r)));
    stats.appendChild(stat('Pontos', nf.format(es.buckets.length)));
    var both = es.buckets.filter(function (_, i) { return es.series[s.a][i] > 0 && es.series[s.b][i] > 0; }).length;
    stats.appendChild(stat('Juntos', nf.format(both)));
    body.appendChild(stats);
    body.appendChild(el('p', null, r === null ? 'Uma das séries não varia no período, então não há correlação a medir.' : describeR(r).replace(/^./, function (c) { return c.toUpperCase(); }) + '.'));
    body.appendChild(el('p', 'note', '"Juntos" conta os intervalos em que os dois aparecem. Correlação não prova causa: confira se há uma origem comum (mesma máquina, mesmo horário, mesmo deploy).'));
    body.appendChild(h4('As duas séries'));
    miniChart(body, es.buckets, [{ name: s.a, values: es.series[s.a], slot: 0 }, { name: s.b, values: es.series[s.b], slot: 1 }], { kind: 'line', unit: ds.unit });
    var actions = el('div', 'actions');
    actions.appendChild(btn(null, 'Ver ' + (s.a.length > 28 ? s.a.slice(0, 27) + '…' : s.a), function () { openDrawer({ kind: 'value', field: s.field, value: s.a, dataset: s.dataset }); }));
    actions.appendChild(btn(null, 'Ver ' + (s.b.length > 28 ? s.b.slice(0, 27) + '…' : s.b), function () { openDrawer({ kind: 'value', field: s.field, value: s.b, dataset: s.dataset }); }));
    body.appendChild(actions);
  }
  function renderNodeDrawer(s) {
    var n = s.node;
    document.getElementById('drawer-eyebrow').textContent = s.categories[n.fi] || '';
    document.getElementById('drawer-title').textContent = n.name;
    var stats = el('div', 'stats');
    stats.appendChild(stat('Valor', fmt(n.value, s.unit)));
    if (n.status) { var st = el('div', 'stat'); st.appendChild(el('div', 'label', 'Status')); st.appendChild(statusBadge(n.status, n.status_label)); stats.appendChild(st); }
    drawerBody.appendChild(stats);
    if (n.detail) drawerBody.appendChild(el('p', null, n.detail));
    renderSpecDetails(drawerBody, n.details);
  }
  function renderDrawer() {
    drawerCharts.forEach(function (c) { c.dispose(); });
    drawerCharts = [];
    drawerBody.textContent = '';
    if (!drawerState) return;
    if (drawerState.kind === 'pair') renderPairDrawer(drawerState);
    else if (drawerState.kind === 'node') renderNodeDrawer(drawerState);
    else renderValueDrawer(drawerState);
  }

  // ======================================================================
  // barra de status (rodapé), minimapa da rolagem e barra de topo
  // ======================================================================
  var STATUS_RANK = { critical: 4, serious: 3, warning: 2, good: 1, info: 0 };
  var STATUS_HEX = { critical: '#d03b3b', serious: '#ec835a', warning: '#fab219', good: '#0ca30c', info: '#4f61ab' };
  function overallStatus() {
    var sum = spec.sections.filter(function (s) { return s.type === 'text' && s.variant === 'summary' && s.status; })[0];
    if (sum) return sum.status;
    var best = null;
    spec.sections.forEach(function (s) {
      if (s.type === 'alerts') (s.items || []).forEach(function (a) {
        var st = a.severity || 'info';
        if (!best || (STATUS_RANK[st] || 0) > (STATUS_RANK[best] || 0)) best = st;
      });
      if (s.type === 'kpis') (s.items || []).forEach(function (k) {
        var st = kpiStatus(k, k.value);
        if (st && (!best || (STATUS_RANK[st] || 0) > (STATUS_RANK[best] || 0))) best = st;
      });
    });
    return best;
  }
  var reportStatus = overallStatus();
  var dotHex = reportStatus ? STATUS_HEX[reportStatus] : null;
  document.getElementById('brand-logo').innerHTML = logoSvg({ dot: dotHex });
  var subEl = document.getElementById('brand-subtitle');
  subEl.textContent = spec.subtitle || spec.period || 'Relatório';
  subEl.title = spec.title + (spec.subtitle ? ' — ' + spec.subtitle : '');
  (function setupFavicon() {
    var link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.href = 'data:image/svg+xml,' + encodeURIComponent(logoSvg({ solid: true, dot: dotHex }));
    document.head.appendChild(link);
  })();

  var sbNode = document.getElementById('status-bar'), sbHover = null;
  function renderStatusItems(items, isHover) {
    sbNode.textContent = '';
    items.forEach(function (it) {
      if (!it || (!it.value && !it.label)) return;
      var s = el('span', 'sb-item' + (isHover ? ' hover' : '') + (it.wide ? ' wide' : ''));
      if (it.label) s.appendChild(el('span', 'sb-label', it.label));
      if (it.value) s.appendChild(el('span', 'sb-value' + (it.accent ? ' accent' : ''), it.value));
      sbNode.appendChild(s);
    });
  }
  function defaultStatusItems() {
    var items = [{ value: 'Jaylog Report' }];
    if (currentTab === 'overview') {
      if (reportStatus) items.push({ label: 'Situação:', value: STATUS_LABEL[reportStatus] || reportStatus, accent: (STATUS_RANK[reportStatus] || 0) >= 2 });
      if (spec.period) items.push({ label: 'Período:', value: spec.period, wide: true });
      if (primary && primary.value) {
        var m0 = measureOf(primary, {}), tot0 = aggRows(primary.rows, m0);
        items.push({ label: 'Total:', value: fmt(tot0, primary.unit), accent: true });
      }
      return items;
    }
    var parts = [];
    if (state.range) parts.push(rangeText());
    Object.keys(state.sel).forEach(function (f) { if (state.sel[f].length) parts.push(labelOf(f) + ': ' + state.sel[f].join(', ')); });
    items.push({ label: hasFilters() ? 'Filtro:' : 'Recorte:', value: parts.length ? parts.join(' · ') : 'Todo o período' });
    if (primary && primary.value) {
      var m = measureOf(primary, {}), now = aggRows(filteredRows(primary), m), all = aggRows(primary.rows, m);
      items.push({ label: 'No recorte:', value: fmt(now) + ' de ' + fmt(all, primary.unit), accent: true });
      if (all) items.push({ value: pf.format(now / all), accent: true });
    }
    items.push({ label: 'Dica:', value: 'Passe o mouse num gráfico para inspecionar · clique para filtrar', wide: true });
    return items;
  }
  var statusBar = {
    refresh: function () { if (!sbHover) renderStatusItems(defaultStatusItems(), false); },
    hover: function (items) { sbHover = items; renderStatusItems(items || defaultStatusItems(), !!items); }
  };

  var minimapNode = document.getElementById('minimap');
  var scheduleMinimap = debounceFrame(function () {
    minimapNode.textContent = '';
    var docH = document.documentElement.scrollHeight;
    if (docH <= window.innerHeight + 40) return;
    var activePanel = document.getElementById(currentTab === 'overview' ? 'tab-overview' : 'tab-analysis');
    if (!activePanel) return;
    var targets = activePanel.querySelectorAll('[data-mark], tr.selected');
    Array.prototype.forEach.call(targets, function (node) {
      var r = node.getBoundingClientRect();
      if (!r.height) return;
      var top = ((r.top + window.scrollY) / docH) * 100;
      var h = Math.max(0.6, (r.height / docH) * 100);
      var mark = el('span', 'mark');
      mark.style.top = top.toFixed(2) + '%';
      mark.style.height = h.toFixed(2) + '%';
      mark.style.background = 'var(--' + (node.dataset.mark || 'brand') + ')';
      minimapNode.appendChild(mark);
    });
  });

  // ======================================================================
  // página
  // ======================================================================
  document.getElementById('title').textContent = spec.title;
  document.getElementById('subtitle').textContent = spec.subtitle || '';
  var generated = new Date(spec.generated_at);
  document.getElementById('meta').textContent = 'Gerado em ' + generated.toLocaleString('pt-BR') + (spec.period ? ' · ' + spec.period : '');
  var footer = document.getElementById('footer');
  footer.appendChild(el('div', null, 'Fonte: ' + (spec.source || 'Jaylog MCP')));
  footer.appendChild(el('div', null, 'Relatório autocontido · gráficos com Apache ECharts (licença Apache-2.0)' + (dsNames.length ? ' · os filtros ficam no endereço da página' : '')));

  loadHash();
  var panels = { overview: document.getElementById('tab-overview'), analysis: document.getElementById('tab-analysis') };
  var hasTab = { overview: false, analysis: false };
  spec.sections.forEach(function (s) { s._tab = s.tab || (s.type === 'chart' ? 'analysis' : 'overview'); hasTab[s._tab] = true; });
  defaultTab = hasTab.overview ? 'overview' : 'analysis';
  currentTab = savedTab && hasTab[savedTab] ? savedTab : defaultTab;
  if (!(hasTab.overview && hasTab.analysis)) document.getElementById('tabs').hidden = true;
  function showTab(name, keepScroll) {
    if (!hasTab[name]) return;
    currentTab = name;
    document.getElementById('tab-overview').hidden = name !== 'overview';
    document.getElementById('tab-analysis').hidden = name !== 'analysis';
    sidebar.hidden = name !== 'analysis' || !hasTab.analysis;
    ['overview', 'analysis'].forEach(function (t) { document.getElementById('tab-btn-' + t).setAttribute('aria-selected', String(t === name)); });
    if (!keepScroll) window.scrollTo({ top: 0 });
    statusBar.hover(null);
    requestAnimationFrame(function () { entries.forEach(function (e) { if (e.instance) e.instance.resize(); }); scheduleMinimap(); });
    saveHash();
  }
  ['overview', 'analysis'].forEach(function (t) {
    var b = document.getElementById('tab-btn-' + t);
    b.addEventListener('click', function () { showTab(t); });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var other = t === 'overview' ? 'analysis' : 'overview';
      showTab(other); document.getElementById('tab-btn-' + other).focus();
    });
  });
  var revealer = !reduceMotion && 'IntersectionObserver' in window ? new IntersectionObserver(function (items) {
    items.forEach(function (it) { if (it.isIntersecting) { it.target.classList.add('in'); revealer.unobserve(it.target); } });
  }, { rootMargin: '0px 0px -40px 0px' }) : null;
  spec.sections.forEach(function (section, i) {
    var block = el('section', 'block');
    section._id = section.id || 'secao-' + (i + 1);
    block.id = section._id;
    if (section.title) block.appendChild(el('h2', null, section.title));
    if (section.description) block.appendChild(el('p', 'description', section.description));
    ({ kpis: renderKpis, chart: renderChart, table: renderTable, alerts: renderAlerts, text: renderText, timeline: renderTimeline })[section.type](section, block);
    if (revealer) { block.classList.add('reveal'); revealer.observe(block); }
    panels[section._tab].appendChild(block);
  });
  if (hasTab.overview && hasTab.analysis) {
    var cta = el('section', 'block no-print');
    var ccard = el('div', 'card explore');
    var fnames = filterDefs.map(function (d) { return (d.label || labelOf(d.field)).toLowerCase(); });
    ccard.appendChild(el('p', null, 'Quer investigar? Na análise detalhada estão os gráficos, cada um com uma explicação de como ler' +
      (fnames.length ? ', e você pode filtrar tudo por ' + (fnames.length > 1 ? fnames.slice(0, -1).join(', ') + ' e ' + fnames[fnames.length - 1] : fnames[0]) : '') + '.'));
    ccard.appendChild(btn('primary', 'Abrir a análise detalhada →', function () { showTab('analysis'); }));
    cta.appendChild(ccard);
    panels.overview.appendChild(cta);
  }
  if (hasTab.analysis) buildSidebar();

  // Botões de ícone da barra de topo (estilo Tachyon)
  var topToolbar = document.getElementById('toolbar');
  function iconBtn(cls, iconName, title, onClick) {
    var b = btn('toolbar-btn' + (cls ? ' ' + cls : ''), null, onClick);
    b.title = title;
    b.setAttribute('aria-label', title);
    b.appendChild(icon(iconName));
    topToolbar.appendChild(b);
    return b;
  }
  var resetTopBtn = iconBtn(null, 'filtro', 'Limpar todos os filtros', function () { clearAll(); toast('Filtros limpos'); });
  resetTopBtn.hidden = !hasFilters();
  iconBtn(null, 'link', 'Copiar link com o recorte atual', function () {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { toast('Link copiado'); }, function () { toast(url); });
    else toast(url);
  });
  iconBtn(null, 'imprimir', 'Imprimir ou salvar em PDF', function () { window.print(); });
  if (hasTab.analysis) iconBtn(null, 'ajuda', 'Como usar a análise e os filtros', filterHelp);
  var toggle = iconBtn('theme-toggle', 'lua', 'Alternar tema claro/escuro');
  toggle.id = 'theme-toggle';

  function isDark() { return css('color-scheme') === 'dark'; }
  function syncToggle() {
    var dark = isDark();
    toggle.textContent = '';
    toggle.appendChild(icon(dark ? 'sol' : 'lua'));
    var label = dark ? 'Alternar para o tema claro' : 'Alternar para o tema escuro';
    toggle.title = label;
    toggle.setAttribute('aria-label', label);
  }
  toggle.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('jaylog-theme', next); } catch (e) { /* sem localStorage */ }
    syncToggle();
    redrawAll();
    if (drawerState) renderDrawer();
  });
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (!root.hasAttribute('data-theme')) { syncToggle(); redrawAll(); if (drawerState) renderDrawer(); }
    });
  }

  showTab(currentTab, true);

  // Gráficos só são criados quando chegam perto da tela: a animação de entrada acontece quando o
  // leitor chega neles, e a página abre rápido mesmo com muitos gráficos.
  if ('IntersectionObserver' in window) {
    var lazy = new IntersectionObserver(function (items) {
      items.forEach(function (it) {
        if (!it.isIntersecting) return;
        var e = entries.filter(function (x) { return x.box === it.target; })[0];
        lazy.unobserve(it.target);
        if (e) ensureInit(e);
      });
    }, { rootMargin: '120px 0px' });
    entries.forEach(function (e) { lazy.observe(e.box); });
  } else entries.forEach(ensureInit);

  listeners.push(updateCharts);
  listeners.push(function () { kpiUpdaters.forEach(function (fn) { fn(); }); });
  listeners.push(function () { tableUpdaters.forEach(function (fn) { fn(); }); });
  listeners.push(function () { if (drawerState) renderDrawer(); });
  listeners.push(function () { resetTopBtn.hidden = !hasFilters(); statusBar.refresh(); scheduleMinimap(); });
  requestAnimationFrame(function () { kpiUpdaters.slice().forEach(function (fn) { fn(); }); scheduleMinimap(); });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || helpDialog.open) return;
    closeDrawer();
  });
  var resize = debounceFrame(function () {
    entries.forEach(function (c) { if (c.instance) c.instance.resize(); });
    drawerCharts.forEach(function (c) { c.resize(); });
    scheduleMinimap();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('beforeprint', function () {
    var hidden = document.querySelectorAll('.tab-panel[hidden]');
    Array.prototype.forEach.call(hidden, function (p) { p.hidden = false; });
    entries.forEach(ensureInit);
    entries.forEach(function (c) { c.instance.resize(); });
    Array.prototype.forEach.call(hidden, function (p) { p.hidden = true; });
  });
  syncToggle();
})();
</script>
</body>
</html>
